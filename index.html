<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵隐仙踪 · AI 生图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0a0f1e;color:#f1f5f9;min-height:100vh;display:flex;justify-content:center;padding:20px}
.container{max-width:900px;width:100%}
h1{font-size:24px;margin:20px 0;background:linear-gradient(135deg,#6366f1,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:10px}
.card{background:#121a2e;border:1px solid #27324d;border-radius:14px;padding:20px;margin-bottom:16px}
label{font-size:13px;color:#94a3b8;display:block;margin-bottom:6px;font-weight:600}
textarea,.input,.select{width:100%;background:#0e1525;border:1px solid #27324d;color:#f1f5f9;border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;transition:border-color .2s}
textarea:focus,.input:focus,.select:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
textarea{min-height:80px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 6px 18px -6px rgba(99,102,241,.5)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px -6px rgba(99,102,241,.6)}
.btn-primary:disabled{opacity:.5;cursor:wait;transform:none}
.btn-ghost{background:#1a2540;color:#94a3b8;border:1px solid #27324d}
.btn-ghost:hover{background:#6366f1;color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.row>*{flex:1;min-width:120px}
.badge{display:inline-block;background:rgba(99,102,241,.15);color:#a5b4fc;border-radius:6px;padding:4px 10px;font-size:12px;margin:4px;cursor:pointer;transition:all .15s}
.badge:hover{background:rgba(99,102,241,.3)}
.badge.active{background:#6366f1;color:#fff}
#result{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:16px}
#result img{width:100%;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.status{text-align:center;color:#94a3b8;padding:20px;font-size:14px}
.status .loading{display:inline-block;width:16px;height:16px;border:2px solid #6366f1;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px;color:#fca5a5;font-size:13px;margin-top:12px}
.footer{text-align:center;color:#475569;font-size:12px;padding:20px}
.style-chips{margin:8px 0;display:flex;flex-wrap:wrap;gap:4px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <h1>✨ 灵隐仙踪 · AI 生图</h1>
    <button class="btn btn-ghost" onclick="toggleDemo()" id="modeBtn">🎮 演示模式</button>
  </div>

  <div class="card">
    <label>🎨 描述画面</label>
    <textarea id="prompt" placeholder="例如：一只在樱花树下的橘猫，柔和光线，电影质感..."></textarea>
    <div class="style-chips" id="chips"></div>

    <div class="row">
      <div><label>尺寸</label><select id="size" class="select"><option>1024x1024</option><option>1792x1024</option><option>1024x1792</option></select></div>
      <div><label>数量</label><select id="count" class="select"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
    </div>

    <div style="margin-top:16px;display:flex;gap:12px;align-items:center">
      <button class="btn btn-primary" id="genBtn" onclick="generate()">🚀 立即生成</button>
      <span id="hint" style="color:#64748b;font-size:13px">等待中...</span>
    </div>
  </div>

  <div id="result"></div>
  <div class="footer">灵隐仙踪专属 · 基于 ciyuanapi GPT Image 2</div>
</div>

<script>
const STYLES = ['赛博朋克','水彩画','电影质感','动漫','写实摄影','3D渲染','油画','极简','奇幻','像素风'];
const STYLE_PROMPTS = {
  '赛博朋克':'cyberpunk, neon lights, futuristic city, cinematic',
  '水彩画':'watercolor painting, soft edges, artistic, pastel',
  '电影质感':'cinematic lighting, film grain, dramatic, 8k',
  '动漫':'anime style, detailed illustration, vibrant colors',
  '写实摄影':'photorealistic, dslr, sharp focus, natural light',
  '3D渲染':'3d render, octane render, ray tracing, highly detailed',
  '油画':'oil painting, classical art, rich texture, masterpiece',
  '极简':'minimalist, clean composition, simple, elegant',
  '奇幻':'fantasy art, magical, ethereal, epic',
  '像素风':'pixel art, retro game style, 16-bit'
};
const DEMO_IMGS = [
  'https://image.qwenlm.ai/public_source/7058e64c-f44c-4796-9f6a-af85d437d4b4/1cedd7795-f99d-4691-a2f9-63b2e4a72983.png',
  'https://image.qwenlm.ai/public_source/7058e64c-f44c-4796-9f6a-af85d437d4b4/1ff409047-dee0-4a7e-b5e5-16af87183e26.png',
  'https://image.qwenlm.ai/public_source/7058e64c-f44c-4796-9f6a-af85d437d4b4/1e5f72766-cc7f-462c-af84-e71354a053a3.png',
  'https://image.qwenlm.ai/public_source/7058e64c-f44c-4796-9f6a-af85d437d4b4/16b445943-9608-4e7a-9dd0-ce0c54a03a5f.png'
];

let isDemo = true;

function initChips() {
  const c = document.getElementById('chips');
  STYLES.forEach(s => {
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = s;
    b.onclick = () => {
      const ta = document.getElementById('prompt');
      const english = STYLE_PROMPTS[s];
      ta.value = ta.value.trim() ? ta.value.trim() + ', ' + english : english;
    };
    c.appendChild(b);
  });
}

function toggleDemo() {
  isDemo = !isDemo;
  document.getElementById('modeBtn').textContent = isDemo ? '🎮 演示模式' : '🔌 真实 API';
  document.getElementById('hint').textContent = isDemo ? '演示模式 · 内置示例图' : 'ciyuanapi · GPT Image 2';
}

async function generate() {
  const btn = document.getElementById('genBtn');
  const prompt = document.getElementById('prompt').value.trim();
  const result = document.getElementById('result');

  if (!prompt) { alert('请输入提示词'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="loading" style="display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px"></span> 生成中...';
  
  if (isDemo) {
    // 演示模式
    result.innerHTML = '';
    await new Promise(r => setTimeout(r, 1500));
    const count = parseInt(document.getElementById('count').value);
    for (let i = 0; i < count; i++) {
      const img = DEMO_IMGS[Math.floor(Math.random() * DEMO_IMGS.length)];
      result.innerHTML += `<img src="${img}" alt="demo">`;
    }
    btn.disabled = false;
    btn.innerHTML = '🚀 立即生成';
    return;
  }

  // 真实 API 模式
  try {
    const size = document.getElementById('size').value;
    const n = parseInt(document.getElementById('count').value);
    const apiUrl = 'https://code.ciyuanapi.xyz/v1/images/generations';

    const res = await fetch(apiUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer sk-5toBMYlaiN7ZwozNXF0yb96yegUXlROFcBBydjHyXU1WhVXi'
      },
      body: JSON.stringify({
        model: 'gpt-image-2',
        prompt: prompt,
        n: 1,
        size: size
      })
    });

    if (!res.ok) {
      const text = await res.text().catch(() => '');
      let errMsg = text.slice(0, 200);
      if (errMsg.includes('model_not_found')) errMsg = '模型不可用，请检查模型名称';
      result.innerHTML = `<div class="error">❌ 错误 ${res.status}: ${errMsg}</div>`;
      return;
    }

    const data = await res.json();
    if (!data.data || !data.data.length) {
      result.innerHTML = '<div class="error">❌ 接口返回数据异常</div>';
      return;
    }

    result.innerHTML = '';
    for (const d of data.data) {
      if (d.url) {
        result.innerHTML += `<img src="${d.url}" alt="生成结果">`;
      } else if (d.b64_json) {
        // 使用 Blob 方式处理大图片，避免 data URL 过长
        const byteChars = atob(d.b64_json);
        const byteNums = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
        const byteArr = new Uint8Array(byteNums);
        const blob = new Blob([byteArr], {type: 'image/png'});
        const url = URL.createObjectURL(blob);
        result.innerHTML += `<img src="${url}" alt="生成结果">`;
      }
    }
  } catch(e) {
    result.innerHTML = `<div class="error">❌ ${e.name}: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🚀 立即生成';
  }
}

initChips();
toggleDemo(); // 默认演示模式
</script>
</body>
</html>
